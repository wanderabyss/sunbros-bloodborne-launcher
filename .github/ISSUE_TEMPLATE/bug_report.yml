name: Bug report
description: Something doesn't work in the launcher or the game.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Questions and setup help go to [Discussions](https://github.com/wanderabyss/sunbros-bloodborne-launcher/discussions) instead.
        No game files, keys or saves, please.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the launcher's Home page, or in `version.txt` in the package folder.
      placeholder: "4.2.12"
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver
      placeholder: "RTX 4090, driver 621.01"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Play mode
      options: [Solo, Online, Seamless co-op, Not in game (launcher only)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: last_run.log
      description: Drag `user\last_run.log` from the package folder here, or paste the end of it.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings (for graphics problems)
      description: The launcher's Visuals page (a screenshot), or your `bbport.ini`.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use my own dump of Bloodborne (CUSA03173, version 1.09).
          required: true
        - label: I'm on the latest release, or I said above why not.
