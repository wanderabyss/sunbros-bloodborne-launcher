name: Feature request
description: An idea for the launcher or the port.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do, or what it would fix for you.
    validations:
      required: true
