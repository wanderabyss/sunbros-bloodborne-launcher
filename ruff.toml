# ==============================================================================
# Global Settings
# ==============================================================================

# Target Python version set to Python 3.12.
target-version = "py312"

# Extended line length for modern, wide-screen displays.
line-length = 120

# Automatically fix code on 'ruff check' when safe to do so.
fix = false

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "out",
    "__pycache__",
    ".pytest_cache",
    "graphify-out",
    "runtime",
    "scratch",
    "vendor",
    "reference",
    "custom",
    "bloodborne_pc/out",
    "bloodborne_pc/dist",
    "bloodborne_pc/third_party",
    "bloodborne_pc/gpu/third_party",
    "bloodborne_pc/tools",
    "bloodborne_pc/tests",
    "bloodborne_pc/scripts",
    "bloodborne_pc/ATLAS",
]

# ==============================================================================
# Linter Settings
# ==============================================================================
[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (syntax errors, unused imports/variables)
    "B",    # flake8-bugbear (common bugs and design flaws)
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade (modern Py312 syntax)
    "RUF",  # Ruff-specific rules
]

ignore = [
    "E501",   # Line too long (allows formatter to handle wrapping)
    "E402",   # Module level import not at top of file (used for conditional runtime imports)
    "E701",   # Multiple statements on one line (colon)
    "E702",   # Multiple statements on one line
    "E731",   # Do not assign a lambda expression, use a def
    "B007",   # Loop control variable not used
    "F841",   # Unused variable
    "B008",   # Function call in argument defaults (FastAPI Depends, Query, File)
    "B904",   # Within except clause, raise ... from err
    "B905",   # zip() without explicit strict=
    "RUF001", # Ambiguous unicode characters in strings (UI emojis, dashes, typography)
    "RUF002", # Ambiguous unicode characters in docstrings
    "RUF003", # Ambiguous unicode characters in comments
    "RUF005", # Iterable unpacking vs concatenation
    "RUF006", # Asyncio create_task reference
    "RUF015", # next() vs slice
    "RUF034", # Useless if-else
    "RUF046", # Redundant int cast
    "RUF059", # Unused unpacked variable
    "C408",   # Unnecessary dict() call
    "C401",   # Generator to set comprehension
    "C416",   # Unnecessary set comprehension
    "UP035",  # Deprecated typing imports (typing.Dict, typing.Deque)
]

# Allow unused imports and wildcards in __init__.py and tests
[lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"bloodborne_pc/tests/*" = ["B007", "F841"]

[lint.isort]
combine-as-imports = true
lines-after-imports = 2

# ==============================================================================
# Formatter Settings
# ==============================================================================
[format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
docstring-code-format = true